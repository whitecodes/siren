name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  KEYSTORE_PATH: app/release.jks
  KEYSTORE_PROPS_PATH: keystore.properties

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Create placeholder so build.gradle.kts always finds it
      # (overwritten with real secrets on push)
      - name: Create placeholder keystore.properties
        run: |
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = placeholder
          keyPassword = placeholder
          keyAlias = placeholder
          EOF

      # Only on push: inject real signing secrets
      - name: Prepare release signing key
        if: github.event_name == 'push'
        env:
          STORE_PASS: ${{ secrets.SIREN_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIREN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIREN_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.SIREN_KEYSTORE_BASE64 }}
        run: |
          base64 -d > "$KEYSTORE_PATH" <<< "$KEYSTORE_B64"
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = $STORE_PASS
          keyPassword = $KEY_PASS
          keyAlias = $KEY_ALIAS
          EOF

      - name: Build APKs
        run: ./gradlew assembleDebug ${{ github.event_name == 'push' && 'assembleRelease' || '' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Clean up signing material and placeholder (always runs on every event)
      - name: Clean signing artifacts
        if: always()
        run: rm -f "$KEYSTORE_PATH" "$KEYSTORE_PROPS_PATH"

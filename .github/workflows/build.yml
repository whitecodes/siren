name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  KEYSTORE_PATH: app/release.jks
  KEYSTORE_PROPS_PATH: keystore.properties

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing key
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.SIREN_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = ${{ secrets.SIREN_STORE_PASSWORD }}
          keyPassword = ${{ secrets.SIREN_KEY_PASSWORD }}
          keyAlias = ${{ secrets.SIREN_KEY_ALIAS }}
          EOF

      - name: Build release APK
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Clean release signing key
        if: github.event_name == 'push' && always()
        run: rm -f "$KEYSTORE_PATH" "$KEYSTORE_PROPS_PATH"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

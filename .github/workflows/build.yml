name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  KEYSTORE_PATH: app/release.jks
  KEYSTORE_PROPS_PATH: keystore.properties

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Create placeholder so build.gradle.kts always finds it
      # (overwritten with real secrets on push)
      - name: Create placeholder keystore.properties
        run: |
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = placeholder
          keyPassword = placeholder
          keyAlias = placeholder
          EOF

      # Only on push: inject real signing secrets
      - name: Prepare release signing key
        if: github.event_name == 'push'
        env:
          STORE_PASS: ${{ secrets.SIREN_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIREN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIREN_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.SIREN_KEYSTORE_BASE64 }}
        run: |
          base64 -d > "$KEYSTORE_PATH" <<< "$KEYSTORE_B64"
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = $STORE_PASS
          keyPassword = $KEY_PASS
          keyAlias = $KEY_ALIAS
          EOF

      - name: Debug verify keystore
        if: github.event_name == 'push'
        env:
          STORE_PASS: ${{ secrets.SIREN_STORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.SIREN_KEYSTORE_BASE64 }}
        run: |
          echo "=== Base64 length ==="
          echo "${#KEYSTORE_B64}"
          echo "=== Base64 first 40 chars ==="
          echo "${KEYSTORE_B64:0:40}"
          echo "=== Keystore file ==="
          ls -la "$KEYSTORE_PATH"
          file "$KEYSTORE_PATH"
          echo "=== Magic bytes ==="
          xxd -l 4 "$KEYSTORE_PATH"
          echo "=== keytool verify ==="
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" 2>&1

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build release APK
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && success()
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Clean up signing material regardless of success
      - name: Clean release signing key
        if: github.event_name == 'push' && always()
        run: rm -f "$KEYSTORE_PATH" "$KEYSTORE_PROPS_PATH"

      # PR/debug: remove only the placeholder props so local debug builds
      # that rely on the real keystore.properties are unaffected on dev machines
      - name: Clean placeholder
        if: github.event_name != 'push' && always()
        run: rm -f "$KEYSTORE_PROPS_PATH"
